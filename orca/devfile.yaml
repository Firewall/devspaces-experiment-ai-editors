schemaVersion: 2.3.0

metadata:
  name: orca
  displayName: Orca
  description: Web development environment for coding agents and parallel worktrees
  tags:
    - ai
    - agents
    - worktrees
    - ide
  attributes:
    title: Orca coding agents and worktrees
    arch:
      - x86_64
    publisher: devspaces-experiment
    version: latest
    provider: Provided by [Stably AI](https://www.onorca.dev/) under the [MIT License](https://github.com/stablyai/orca/blob/main/LICENSE)
    repository: https://github.com/stablyai/orca
    firstPublicationDate: '2026-10-03'
    iconMediatype: image/svg+xml
    iconData: |
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
        <rect width="64" height="64" rx="14" fill="#0d1b2a"/>
        <path d="M28 27 L34 11 L39 27 Z" fill="#e8eef3"/>
        <path d="M47 36 L61 25 L57.5 36 L61 47 Z" fill="#e8eef3"/>
        <ellipse cx="29" cy="36" rx="20" ry="9.5" fill="#e8eef3"/>
        <ellipse cx="29" cy="40" rx="17" ry="5" fill="#b9c7d2"/>
        <ellipse cx="17" cy="33" rx="3.6" ry="2.1" fill="#0d1b2a"/>
        <circle cx="12" cy="37" r="1.6" fill="#0d1b2a"/>
        <circle cx="50" cy="19" r="4" fill="#4fc3f7"/>
      </svg>

commands:
  - id: init-orca-injector
    apply:
      component: orca-injector
  - id: init-orca-start
    exec:
      component: orca-runtime
      commandLine: >-
        nohup /orca/entrypoint.sh > /orca/entrypoint-logs.txt 2>&1 &

events:
  preStart:
    - init-orca-injector
  postStart:
    - init-orca-start

components:
  - name: orca-injector
    container:
      image: ${ORCA_IMAGE}
      command:
        - /entrypoint-init-container.sh
      volumeMounts:
        - name: orca
          path: /orca
      memoryLimit: 512Mi
      memoryRequest: 32Mi
      cpuLimit: 500m
      cpuRequest: 30m

  - name: orca-runtime
    container:
      image: quay.io/devfile/universal-developer-image:latest
      env:
        - name: ORCA_PAIRING_ADDRESS
          value: "${ORCA_PAIRING_ADDRESS}"
      volumeMounts:
        - name: orca
          path: /orca
      memoryLimit: 2048Mi
      memoryRequest: 512Mi
      cpuLimit: 1000m
      cpuRequest: 100m
      endpoints:
        - name: orca
          targetPort: 6768
          exposure: public
          protocol: https
          secure: true
          attributes:
            type: main
            cookiesAuthEnabled: true
            discoverable: false
            urlRewriteSupported: true
    attributes:
      app.kubernetes.io/component: orca-runtime
      app.kubernetes.io/part-of: orca.eclipse.org
      controller.devfile.io/container-contribution: true

  - name: orca
    volume: {}
