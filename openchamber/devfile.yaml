schemaVersion: 2.3.0

metadata:
  name: openchamber
  displayName: OpenChamber
  description: Agentic development environment with multi-model AI support
  tags:
    - ai
    - opencode
    - ide
  attributes:
    title: OpenChamber
    arch:
      - x86_64
    publisher: devspaces-experiment
    version: latest
    provider: Provided by the [OpenChamber project](https://github.com/openchamber/openchamber). See the upstream repository for its license terms.
    repository: https://github.com/openchamber/openchamber
    firstPublicationDate: '2025-01-01'
    iconMediatype: image/svg+xml
    iconData: |
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
        <rect width="64" height="64" rx="14" fill="#0b1726"/>
        <path d="M20 48V30a12 12 0 0 1 24 0v18" fill="none" stroke="#4fc3f7" stroke-width="7" stroke-linecap="round"/>
      </svg>

commands:
  - id: init-openchamber-injector
    apply:
      component: openchamber-injector
  - id: init-openchamber-start
    exec:
      component: openchamber-runtime
      commandLine: >-
        nohup /openchamber/entrypoint.sh > /openchamber/entrypoint-logs.txt 2>&1 &

events:
  preStart:
    - init-openchamber-injector
  postStart:
    - init-openchamber-start

components:
  - name: openchamber-injector
    container:
      image: ${OPENCHAMBER_IMAGE}
      command:
        - /entrypoint-init-container.sh
      volumeMounts:
        - name: openchamber
          path: /openchamber
      memoryLimit: 256Mi
      memoryRequest: 32Mi
      cpuLimit: 500m
      cpuRequest: 30m

  - name: openchamber-runtime
    container:
      image: quay.io/devfile/universal-developer-image:latest
      env:
        - name: OPENCHAMBER_UI_PASSWORD
          value: "${OPENCHAMBER_UI_PASSWORD}"
      volumeMounts:
        - name: openchamber
          path: /openchamber
      memoryLimit: 2048Mi
      memoryRequest: 512Mi
      cpuLimit: 1000m
      cpuRequest: 100m
      endpoints:
        - name: openchamber
          targetPort: 3000
          exposure: public
          protocol: https
          secure: true
          attributes:
            type: main
            cookiesAuthEnabled: true
            discoverable: false
            urlRewriteSupported: true
    attributes:
      app.kubernetes.io/component: openchamber-runtime
      app.kubernetes.io/part-of: openchamber.eclipse.org
      controller.devfile.io/container-contribution: true

  - name: openchamber
    volume: {}
