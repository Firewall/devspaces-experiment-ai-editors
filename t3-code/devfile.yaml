schemaVersion: 2.3.0

metadata:
  name: t3-code
  displayName: T3 Code
  description: Minimal web GUI for coding agents
  tags:
    - ai
    - coding
    - ide
  attributes:
    title: T3 Code
    arch:
      - x86_64
    publisher: devspaces-experiment
    version: latest
    provider: Provided by [T3 Code](https://github.com/pingdotgg/t3code) under the [MIT License](https://github.com/pingdotgg/t3code/blob/main/LICENSE)
    repository: https://github.com/pingdotgg/t3code
    firstPublicationDate: '2025-01-01'
    iconMediatype: image/svg+xml
    iconData: |
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
        <rect width="64" height="64" rx="14" fill="#171717"/>
        <path d="M12 18h24v7H12z" fill="#ff6b35"/>
        <path d="M21 18h7v30h-7z" fill="#ff6b35"/>
        <circle cx="45" cy="23" r="4" fill="#f7f7f7"/>
        <circle cx="45" cy="34" r="4" fill="#f7f7f7"/>
        <circle cx="45" cy="45" r="4" fill="#f7f7f7"/>
      </svg>

commands:
  - id: init-t3-code-injector
    apply:
      component: t3-code-injector
  - id: init-t3-code-start
    exec:
      component: t3-code-runtime
      commandLine: >-
        nohup /t3code/entrypoint.sh > /t3code/entrypoint-logs.txt 2>&1 &

events:
  preStart:
    - init-t3-code-injector
  postStart:
    - init-t3-code-start

components:
  - name: t3-code-injector
    container:
      image: ${T3_IMAGE}
      command:
        - /entrypoint-init-container.sh
      volumeMounts:
        - name: t3code
          path: /t3code
      memoryLimit: 256Mi
      memoryRequest: 32Mi
      cpuLimit: 500m
      cpuRequest: 30m

  - name: t3-code-runtime
    container:
      image: quay.io/devfile/universal-developer-image:latest
      volumeMounts:
        - name: t3code
          path: /t3code
      memoryLimit: 2048Mi
      memoryRequest: 512Mi
      cpuLimit: 1000m
      cpuRequest: 100m
      endpoints:
        - name: t3-code
          targetPort: 3773
          exposure: public
          protocol: https
          secure: true
          attributes:
            type: main
            cookiesAuthEnabled: true
            discoverable: false
            urlRewriteSupported: true
    attributes:
      app.kubernetes.io/component: t3-code-runtime
      app.kubernetes.io/part-of: t3-code.eclipse.org
      controller.devfile.io/container-contribution: true

  - name: t3code
    volume: {}
