schemaVersion: 2.3.0
metadata:
  name: bob
  displayName: Headless Bob console PoC
  description: Browser console with a shared repository and selectable Bob or OpenCode backend
  tags:
    - ai
    - bob
    - opencode
  attributes:
    title: Headless Bob console PoC
    arch:
      - x86_64
    publisher: devspaces-experiment
    version: poc
    provider: IBM Bob is provided by IBM under its own terms. See the [upstream building blocks](https://github.com/ibm-self-serve-assets/building-blocks).
    repository: https://github.com/ibm-self-serve-assets/building-blocks
    firstPublicationDate: '2026-10-30'
    iconMediatype: image/svg+xml
    iconData: |
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
        <rect width="64" height="64" rx="14" fill="#0f62fe"/>
        <circle cx="32" cy="35" r="16" fill="#ffffff"/>
        <circle cx="26" cy="33" r="3" fill="#0f62fe"/>
        <circle cx="38" cy="33" r="3" fill="#0f62fe"/>
        <path d="M25 41c4 4 10 4 14 0" fill="none" stroke="#0f62fe" stroke-width="3" stroke-linecap="round"/>
        <path d="M32 19v-7" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
        <circle cx="32" cy="10" r="3" fill="#ffffff"/>
      </svg>
commands:
  - id: install-opencode
    apply:
      component: opencode-injector
events:
  preStart:
    - install-opencode
components:
  - name: bob-runtime
    container:
      image: ${BOB_IMAGE}
      mountSources: true
      sourceMapping: /projects
      env:
        - name: BOB_WORKSPACE_DIR
          value: /projects/repo
        - name: OPENCODE_MODEL
          value: "${BOB_OPENCODE_MODEL}"
        - name: PATH
          value: /injected-tools/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        - name: XDG_CONFIG_HOME
          value: /projects/.devspaces-bob/home/.config
        - name: XDG_DATA_HOME
          value: /projects/.devspaces-bob/home/.local/share
        - name: XDG_STATE_HOME
          value: /projects/.devspaces-bob/home/.local/state
        - name: XDG_CACHE_HOME
          value: /projects/.devspaces-bob/home/.cache
      volumeMounts:
        - name: injected-tools
          path: /injected-tools
      memoryLimit: 4096Mi
      memoryRequest: 1024Mi
      cpuLimit: 2000m
      cpuRequest: 200m
      endpoints:
        - name: bob
          targetPort: 8000
          exposure: public
          protocol: https
          secure: true
          attributes:
            type: main
            cookiesAuthEnabled: true
            discoverable: false
            urlRewriteSupported: true
    attributes:
      app.kubernetes.io/component: bob-runtime
      app.kubernetes.io/part-of: bob.eclipse.org
  - name: opencode-injector
    attributes:
      che.eclipse.org/admin-manageable: true
    container:
      image: quay.io/che-incubator/dashboard-ai/opencode@sha256:11be643a79b29935ca0b7a8835201fce165dbe6aca646cec8dd05c742d43ee5b
      command:
        - /bin/sh
      args:
        - -ec
        - mkdir -p /injected-tools/bin && cp /usr/local/bin/opencode /usr/local/bin/opencode-bin /injected-tools/bin/
      mountSources: false
      memoryLimit: 1024Mi
      volumeMounts:
        - name: injected-tools
          path: /injected-tools
  - name: injected-tools
    attributes:
      che.eclipse.org/admin-manageable: true
    volume:
      ephemeral: true
      size: 512Mi
