schemaVersion: 2.3.0

metadata:
  name: paseo
  displayName: Paseo + OpenCode
  description: Agentic development environment with parallel agents, terminals, and diffs
  tags:
    - ai
    - agents
    - opencode
    - ide
  attributes:
    title: Paseo — agentic coding on Red Hat AI
    arch:
      - x86_64
    publisher: devspaces-experiment
    version: latest
    provider: Provided by the [Paseo project](https://github.com/getpaseo/paseo). See the upstream repository for its license terms.
    repository: https://github.com/getpaseo/paseo
    firstPublicationDate: '2026-11-03'
    iconMediatype: image/svg+xml
    iconData: |
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
        <rect width="64" height="64" rx="14" fill="#1b1030"/>
        <path d="M14 19h24v6H14z" fill="#a78bfa"/>
        <path d="M14 31h32v6H14z" fill="#a78bfa"/>
        <path d="M14 43h20v6H14z" fill="#a78bfa"/>
        <circle cx="49" cy="22" r="4" fill="#4fc3f7"/>
        <circle cx="51" cy="46" r="4" fill="#4fc3f7"/>
      </svg>

components:
  - name: paseo-runtime
    container:
      image: ${PASEO_IMAGE}
      mountSources: true
      sourceMapping: /projects
      env:
        - name: PASEO_PASSWORD
          value: "${PASEO_PASSWORD}"
        - name: PASEO_HOSTNAMES
          value: "${PASEO_HOSTNAMES}"
        - name: PASEO_TRUSTED_PROXIES
          value: "${PASEO_TRUSTED_PROXIES}"
      command:
        - /bin/bash
        - -c
        - /usr/local/bin/paseo-entrypoint.sh 2>&1 | tee /tmp/paseo-logs.txt
      memoryLimit: 4096Mi
      memoryRequest: 1024Mi
      cpuLimit: 2000m
      cpuRequest: 200m
      endpoints:
        - name: paseo
          targetPort: 6767
          exposure: public
          protocol: https
          secure: true
          attributes:
            type: main
            cookiesAuthEnabled: true
            discoverable: false
            urlRewriteSupported: true
    attributes:
      app.kubernetes.io/component: paseo-runtime
      app.kubernetes.io/part-of: paseo
